schedule:
  fast_seconds: 60
  slow_seconds: 600
  fast_from_hour: 7
  fast_until_hour: 21
  fast_on_weekdays_only: false
min_seconds_per_site: 8
heartbeat_hours: 12
mail_interval_seconds: 20
filter:
  enabled: true
  max_price: 1650
  min_price: 600
  min_rooms: 3
  exclude_keywords:
  - woningruil
  - studentenwoning
  - alleen voor studenten
  - 65 jaar en ouder
  - seniorenwoning
  - antikraak
enrich: true
reply_reminder: Reageer nu. De brief hieronder kun je kopieren en plakken.
brief:
  enabled: true
  namen: Bilal en Linda
  leeftijden: beiden werkend
  inkomen: EUR 5.500
  beschikbaar: direct
  telefoon: 06-XXXXXXXX
  email: jouwmail@voorbeeld.nl
  dossier_url: ''
  tekst: ''
# ============================================================
#  LET OP - gecontroleerd op Railway, 20-09-2026
#
#  Huurwoningen.nl en Huislijn.nl geven HTTP 403 vanaf Railway.
#  Zij blokkeren datacenter-IP's. Vanaf een gewone thuisverbinding
#  werken ze wel. Daarom staan ze hier UIT.
#
#  Wil je ze toch? Draai de bot dan thuis op een oude laptop of
#  Raspberry Pi en zet ze daar op enabled: true.
#
#  Op Railway is de MAILBRUG je kanaal: meld je aan voor de gratis
#  mailalerts van die sites, dan komen ze alsnog in je Telegram.
# ============================================================

