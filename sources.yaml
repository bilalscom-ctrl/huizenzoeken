# ============================================================
#  huurbot v3 - bronnen en instellingen
#  Alle actieve bronnen zijn op 20-09-2026 echt gecontroleerd.
# ============================================================

# ---------- Snelheid en beleefdheid ----------
schedule:
  fast_seconds: 60          # overdag: elke minuut een ronde
  slow_seconds: 600         # 's nachts: elke 10 minuten
  fast_from_hour: 7
  fast_until_hour: 21
  fast_on_weekdays_only: false

# Minimaal aantal seconden tussen twee verzoeken aan DEZELFDE website.
# Hiermee blijf je onder de radar. Lager zetten levert geen snellere
# meldingen op, alleen een grotere kans op een blokkade.
min_seconds_per_site: 8

heartbeat_hours: 12
mail_interval_seconds: 20

# ---------- Filter ----------
# Bij twijfel meldt de bot ALTIJD. Alleen wat zeker buiten bereik valt
# wordt overgeslagen.
filter:
  enabled: true
  max_price: 1650
  min_price: 600
  min_rooms: 3
  # Woorden die de woning voor jullie onbruikbaar maken. Worden ook
  # op de detailpagina gezocht, niet alleen in de titel.
  exclude_keywords:
    - "woningruil"          # daarvoor moet je zelf al een huurwoning hebben
    - "studentenwoning"
    - "alleen voor studenten"
    - "65 jaar en ouder"
    - "seniorenwoning"
    - "antikraak"

enrich: true                # haalt prijs, kamers en adres van de detailpagina

reply_reminder: "Reageer nu. De brief hieronder kun je kopieren en plakken."

# ---------- Je reactiebrief ----------
# VUL DIT IN. De bot zet adres en huurprijs er automatisch in en stuurt
# de brief als los Telegram-bericht, zodat je hem met lang indrukken in
# een keer kunt kopieren.
brief:
  enabled: true
  namen: "Bilal en Linda"
  leeftijden: "beiden werkend"
  inkomen: "EUR 5.500"
  beschikbaar: "direct"
  telefoon: "06-XXXXXXXX"
  email: "jouwmail@voorbeeld.nl"
  dossier_url: ""           # link naar je Drive/Dropbox-map met documenten

  # Wil je een eigen tekst? Gebruik {adres} {prijs} {namen} {inkomen}
  # {beschikbaar} {telefoon} {email} {leeftijden} {url}.
  # Leeg laten = de standaardbrief hierboven in huurbot.py.
  tekst: ""

sources:

